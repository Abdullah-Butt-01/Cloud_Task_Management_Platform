name: Deploy to VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Step 25: Allow manual trigger

//lower case problem here
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Step 25: Build and publish image (reuses CI pipeline logic)
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Step 25: Deploy to remote VM
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 25: Setup SSH for VM access
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}
          log-public-key: false

      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      # Step 25: Deploy to VM via SSH
      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deploying to $VM_HOST..."

          # Step 25: Copy deployment files to VM
          scp docker-compose.yml .env $VM_USER@$VM_HOST:~/log-processing/

          # Step 25: Execute remote deployment commands
          ssh $VM_USER@$VM_HOST << 'EOF'
            set -e

            cd ~/log-processing

            # Step 25: Login to GitHub Container Registry on VM
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Step 25: Pull latest images
            docker compose pull

            # Step 25: Restart services with new images
            docker compose down
            docker compose up -d

            # Step 25: Clean up old images
            docker image prune -f

            # Step 25: Verify deployment
            sleep 10
            curl -f http://localhost:5000/health || exit 1

            echo "Deployment successful!"
          EOF

      # Step 25: Verify deployment from GitHub Actions
      - name: Verify deployment
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          echo "Verifying deployment at http://$VM_HOST:5000/health"
          curl -f http://$VM_HOST:5000/health || exit 1
          echo "✅ Deployment verified!"