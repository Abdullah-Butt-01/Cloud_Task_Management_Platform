name: Test VM Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check VM_HOST secret
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          if [ -z "$VM_HOST" ]; then
            echo "❌ VM_HOST is EMPTY or NOT SET"
            echo "Go to: Settings → Secrets → Actions → New repository secret"
            echo "Name: VM_HOST"
            echo "Value: your-vm-ip-address (no quotes, no http://)"
            exit 1
          else
            echo "✅ VM_HOST is set (length: ${#VM_HOST})"
          fi