version: "3.9"

services: # everything inside this are containers

  api:
    build: . #abdullahbutt01/task-platform:latest
    container_name: task-api
    command: python -m app.main
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on: # start db and redis before api
      - db
      - redis
    volumes:
      - .:/app
      - ${HOST_UPLOAD_FOLDER:-./uploads}:${UPLOAD_FOLDER:-/app/uploads}

  worker:
    build: . #abdullahbutt01/task-platform:latest
    #container_name: task-worker
    command: python -m app.worker
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ${HOST_UPLOAD_FOLDER:-./uploads}:${UPLOAD_FOLDER:-/app/uploads}

  db:
    image: postgres:13 # ready made image
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tasks
    volumes: # data will store outside the container (even is container stops). Persists.
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-cache

volumes:
  postgres_data:
